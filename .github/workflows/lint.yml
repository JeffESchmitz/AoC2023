name: SwiftLint

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  swiftlint:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/realm/swiftlint:0.65.1
    steps:
      - uses: actions/checkout@v7
      - name: Lint
        run: swiftlint lint --reporter github-actions-logging
